pre-commit:
  parallel: false
  commands:
    ruff-format:
      glob: "*.py"
      run: uv run ruff format {staged_files} && git add {staged_files}
    ruff-fix:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files} && git add {staged_files}
    pyproject-fmt:
      glob: "pyproject.toml"
      run: uvx pyproject-fmt==2.29.4 {staged_files} && git add {staged_files}

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    ruff-format-check:
      run: uv run ruff format --check .
    ruff-check:
      run: uv run ruff check .
    mypy:
      run: uv run mypy .
    pytest:
      run: uv run pytest
    bandit:
      run: uv run bandit -r src/pipeline_analytics -x src/pipeline_analytics/_generated
    pip-audit:
      run: uv run pip-audit
