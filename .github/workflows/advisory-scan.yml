# The scan half of rules/dependencies.md (#103): audit main and keep one open
# "Dependency advisories" issue that lists what's there. Daily for advisories published against
# pins that haven't moved, on a lockfile push so a merged fix closes the ticket at once, and by
# hand. An audit that errors (registry down) fails the job and leaves the ticket alone.
name: advisory-scan

on:
  schedule:
    - cron: "41 5 * * *"
  push:
    branches: [main]
    paths: [pyproject.toml, uv.lock, .github/workflows/advisory-scan.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.15"
      - uses: alrayyes/advisory-scan@c9f794de4354b870e159510f036779baf20f4a2f # v0.3.1
        with:
          mode: scan
          command: uv run pip-audit
          setup: uv sync --locked --all-groups
          labels: dependencies
