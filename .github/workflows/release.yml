name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # A GITHUB_TOKEN-authored PR needs a human approval GitHub itself
      # injects (rules/releases.md's "RELEASE_TOKEN PAT is not automatically
      # droppable"), and even with that approved, its squash-merge commit is
      # GITHUB_TOKEN-authored too -- no workflow fires on it, so this job
      # never re-runs to cut the actual tag. RELEASE_TOKEN (a real-identity
      # PAT) sidesteps both. See release-auto-merge.yml for the other half.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: python
          token: ${{ secrets.RELEASE_TOKEN }}

  sync-lockfile:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # release-please bumps the `version` key in pyproject.toml but has no
      # idea uv.lock also records that same version for the package's own
      # self-entry -- left alone, every release PR fails `uv sync --locked`
      # in CI for a reason that has nothing to do with the release itself
      # (confirmed live: alrayyes/pipeline-analytics-sdk-python#1).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
      - run: uv lock
      - run: |
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: sync uv.lock with release-please's version bump"
            git push
          fi

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC) -- no token to manage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
