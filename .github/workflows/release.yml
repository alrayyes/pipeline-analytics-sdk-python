name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # A GITHUB_TOKEN-authored PR needs a human approval GitHub itself
      # injects (rules/releases.md's "RELEASE_TOKEN PAT is not automatically
      # droppable"), and even with that approved, its squash-merge commit is
      # GITHUB_TOKEN-authored too -- no workflow fires on it, so this job
      # never re-runs to cut the actual tag. RELEASE_TOKEN (a real-identity
      # PAT) sidesteps both. See release-auto-merge.yml for the other half.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: python
          token: ${{ secrets.RELEASE_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC) -- no token to manage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
