# Builds the API reference from docstrings, runs the tests, and publishes
# both to GitHub Pages (apis.ryankes.eu/pipeline-analytics-sdk-python/):
# docs/ for the reference, reports/ for the test and coverage reports. A
# repo has one Pages deployment, so one job assembles both. A red test run
# fails the build job, so nothing is deployed. Separate from ci.yml's own
# jobs since this deploys something (a live site), not just checks a diff.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
      - run: uv sync --locked --all-extras --all-groups
      - name: Test, with coverage
        run: >-
          uv run pytest --cov=pipeline_analytics --cov-report=xml
          --cov-report=html --junitxml=junit.xml -o junit_family=legacy
      - run: uv run mkdocs build --strict --site-dir site/docs
      - run: ./hack/assemble-reports.sh . site/reports
      - run: cp hack/site-index.html site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check the live coverage report
        # The deploy succeeds whether or not the URL serves the file, and the
        # CDN can lag a few seconds, so retry before failing.
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output coverage.xml \
            "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml
