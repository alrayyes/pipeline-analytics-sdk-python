site_name: pipeline-analytics-sdk-python
site_url: https://alrayyes.github.io/pipeline-analytics-sdk-python/
repo_url: https://github.com/alrayyes/pipeline-analytics-sdk-python

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            docstring_style: google

nav:
  - Home: index.md
  - API reference: reference.md
